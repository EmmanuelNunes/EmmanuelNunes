<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Gradiente de Fundo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Gradiente do Nome -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <radialGradient id="radial" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 58px; fill: url(#nameGrad); letter-spacing: -1px; }
    .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 21px; fill: #94a3b8; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 15px; fill: #64748b; }
    .pill-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #cbd5e1; }
  </style>

  <!-- Fundo -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#radial)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Rede Neural / Conexões Decorativas -->
  <g opacity="0.3" stroke="#4f46e5" stroke-width="1">
    <line x1="80" y1="60" x2="220" y2="140" />
    <line x1="220" y1="140" x2="150" y2="240" />
    <line x1="150" y1="240" x2="290" y2="210" />
    <line x1="980" y1="80" x2="1100" y2="160" />
    <line x1="1100" y1="160" x2="1030" y2="250" />
    <line x1="1030" y1="250" x2="920" y2="200" />
  </g>
  <g fill="#38bdf8" opacity="0.5">
    <circle cx="80" cy="60" r="4" />
    <circle cx="220" cy="140" r="5" />
    <circle cx="150" cy="240" r="4" />
    <circle cx="290" cy="210" r="3.5" />
    <circle cx="980" cy="80" r="4" />
    <circle cx="1100" cy="160" r="5" />
    <circle cx="1030" cy="250" r="4" />
    <circle cx="920" cy="200" r="3.5" />
  </g>

  <!-- Texto Principal -->
  <g text-anchor="middle">
    <!-- Saudação / Tag -->
    <text x="600" y="85" class="tagline" letter-spacing="3">👋 OLÁ, MUNDO! EU SOU</text>

    <!-- Nome com Glow -->
    <text x="600" y="150" class="name" filter="url(#glow)">Emmanuel Nunes</text>

    <!-- Cargo / Subtítulo -->
    <text x="600" y="195" class="role">Inteligência Artificial • Agentes Autônomos • Python • Engenharia de Software</text>

    <!-- Frase de Impacto -->
    <text x="600" y="230" class="tagline">Construindo aplicações inteligentes, automações avançadas e sistemas orientados a agentes.</text>

    <!-- Chips / Badges -->
    <g transform="translate(300, 260)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="65" y="19" class="pill-txt" text-anchor="middle">🤖 AI & LLMs</text>

      <rect x="145" y="0" width="155" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="222" y="19" class="pill-txt" text-anchor="middle">⚡ Autonomous Agents</text>

      <rect x="315" y="0" width="135" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="382" y="19" class="pill-txt" text-anchor="middle">🐍 Python Core</text>

      <rect x="465" y="0" width="135" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="532" y="19" class="pill-txt" text-anchor="middle">🔬 Tech Research</text>
    </g>
  </g>
</svg>
