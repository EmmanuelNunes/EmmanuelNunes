<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0b1018"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2c58b"/>
      <stop offset="50%" stop-color="#e7ba7d"/>
      <stop offset="100%" stop-color="#c99757"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#85c6bc"/>
      <stop offset="100%" stop-color="#4aa398"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bba6ce"/>
      <stop offset="100%" stop-color="#8668a8"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e7ba7d" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#85c6bc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b1018" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#243042" opacity="0.45"/>
    </pattern>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
      
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="680" fill="url(#bgGrad)"/>
  <rect width="1600" height="680" fill="url(#dotGrid)"/>

  <!-- Left Editorial Badge -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="360" height="32" rx="6" fill="#141c28" stroke="#29374c" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="5" fill="#e7ba7d"/>
    <text x="32" y="21" class="font-mono" font-size="12" font-weight="700" fill="#f2c58b" letter-spacing="1.5">EMMANUEL NUNES · ARCHITECTURE &amp; AGENTS</text>
  </g>

  <!-- Right Meta -->
  <g transform="translate(1120, 90)">
    <text x="380" y="21" text-anchor="end" class="font-mono" font-size="12" fill="#71869f" letter-spacing="2">ANTIGRAVITY / CLAUDE / CODEX / PYTHON</text>
  </g>

  <!-- Main Hero Titles -->
  <g transform="translate(100, 210)">
    <text x="0" y="0" class="font-mono" font-size="14" font-weight="700" fill="#85c6bc" letter-spacing="3">ENGENHARIA DE SOFTWARE &amp; SISTEMAS AUTÔNOMOS</text>
    <text x="0" y="90" class="font-sans" font-size="88" font-weight="900" fill="#ffffff" letter-spacing="-2">EMMANUEL</text>
    <text x="0" y="175" class="font-sans" font-size="88" font-weight="900" fill="url(#goldGrad)" letter-spacing="-2">NUNES</text>
    <text x="0" y="240" class="font-sans" font-size="20" fill="#9db1c8" font-weight="400">Arquiteto de IA, Pesquisador Científico e Desenvolvedor de Soluções Agênticas de Alta Precisão.</text>
    
    <!-- Pills -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="190" height="34" rx="17" fill="#152132" stroke="#2d4263" stroke-width="1"/>
      <text x="95" y="21" text-anchor="middle" class="font-mono" font-size="12" fill="#e7ba7d" font-weight="600">VIBE-CODING-TOOLKIT</text>

      <rect x="205" y="0" width="150" height="34" rx="17" fill="#152132" stroke="#2d4263" stroke-width="1"/>
      <text x="280" y="21" text-anchor="middle" class="font-mono" font-size="12" fill="#85c6bc" font-weight="600">REVERSA SDD</text>

      <rect x="370" y="0" width="130" height="34" rx="17" fill="#152132" stroke="#2d4263" stroke-width="1"/>
      <text x="435" y="21" text-anchor="middle" class="font-mono" font-size="12" fill="#bba6ce" font-weight="600">MIRA D3.JS</text>

      <rect x="515" y="0" width="170" height="34" rx="17" fill="#152132" stroke="#2d4263" stroke-width="1"/>
      <text x="600" y="21" text-anchor="middle" class="font-mono" font-size="12" fill="#94caa6" font-weight="600">SCILAUNCH &amp; TAI-G</text>
    </g>
  </g>

  <!-- Right Side: Agentic Orbital Portal -->
  <g transform="translate(0, 0)">
    <circle cx="1250" cy="340" r="240" fill="url(#portalGlow)"/>
    
    <!-- Outer Orbit -->
    <circle cx="1250" cy="340" r="200" fill="none" stroke="#243347" stroke-width="1.5" stroke-dasharray="6 8"/>
    
    <g class="orbit-ring">
      <circle cx="1250" cy="340" r="160" fill="none" stroke="#2f425b" stroke-width="1.8"/>
      <circle cx="1410" cy="340" r="7" fill="#e7ba7d"/>
      <circle cx="1090" cy="340" r="5" fill="#85c6bc"/>
    </g>

    <g class="orbit-ring-rev">
      <circle cx="1250" cy="340" r="115" fill="none" stroke="#3d5575" stroke-width="1.5" stroke-dasharray="4 6"/>
      <circle cx="1250" cy="225" r="6" fill="#bba6ce"/>
      <circle cx="1250" cy="455" r="6" fill="#94caa6"/>
    </g>

    <!-- Core Element -->
    <g class="pulse-core">
      <circle cx="1250" cy="340" r="65" fill="#101926" stroke="#e7ba7d" stroke-width="2.5"/>
      <text x="1250" y="333" text-anchor="middle" class="font-sans" font-size="28" font-weight="900" fill="#ffffff">EN</text>
      <text x="1250" y="356" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#f2c58b" letter-spacing="1">AGENTS</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <line x1="100" y1="600" x2="1500" y2="600" stroke="#1d2737" stroke-width="1.5"/>
  <g transform="translate(100, 630)">
    <text x="0" y="0" class="font-mono" font-size="12" fill="#6d839c">TOOLKIT · SCILAUNCH · FASTWHISPER · SECOMP · TAI-G · AMIGOSECRETO</text>
    <text x="1400" y="0" text-anchor="end" class="font-mono" font-size="12" font-weight="700" fill="#e7ba7d" letter-spacing="2">BUILD WITH INTENT. SHIP WITH FLOW.</text>
  </g>
</svg>
